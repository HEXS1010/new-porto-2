<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HEXSPRO Reveal</title>

  <style>
    :root {
      --pos: -500%;
    }

    body{
      margin:0;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#000;
      font-family:sans-serif;
    }

    /* Grub isi: logo + teks */
    .group {
      display:flex;
      align-items:center;
      gap:24px;

      /* SHINING → dipindah ke MASK supaya ngikut bentuk logo & teks */
      -webkit-mask-image: linear-gradient(
        90deg,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,0.3) 20%,
        rgba(0,0,0,1) 50%,
        rgba(0,0,0,0.3) 80%,
        rgba(0,0,0,0) 100%
      );
      -webkit-mask-size: 80% 100%;
      -webkit-mask-repeat:no-repeat;
      -webkit-mask-position: var(--pos);

      mask-image: linear-gradient(
        90deg,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,0.3) 20%,
        rgba(0,0,0,1) 50%,
        rgba(0,0,0,0.3) 80%,
        rgba(0,0,0,0) 100%
      );
      mask-size:80% 100%;
      mask-repeat:no-repeat;
      mask-position: var(--pos);
    }

    /* Logo tetap normal */
    .logo {
      width:180px;
      height:180px;
      object-fit:contain;
      filter:brightness(1.35);
    }

    /* Teks tetap kodenya kamu */
    p {
      margin:0;
      font-size:80px;
      text-transform:uppercase;
      letter-spacing:4px;
      color:white;
      filter:brightness(1.4);
    }

  </style>
</head>

<body>

  <!-- Logo → lalu Teks, shining menyapu satu garis -->
  <div class="group">
    <img class="logo" src="img/logo versi 2.png" alt="logo">
    <p>HEXS PROJECT</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    // Shining sweep → logo dulu, lalu teks
    gsap.to(document.documentElement, {
      duration: 3.5,  // dibuat lebih lambat seperti permintaanmu
      ease: "linear",
      css: { "--pos": "500%" },
      repeat: 0
    });
  </script>

</body>
</html>
